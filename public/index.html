<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shared Todo List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #1e1e1e;
      --text-light: #000000;
      --text-dark: #f0f0f0;
      --accent: #0066ff;
      --border: #cccccc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --text: var(--text-dark);
        --border: #555555;
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: var(--bg-light);
        --text: var(--text-light);
      }
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    main {
      flex: 1;
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .input-group input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .input-group button {
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .input-group button:hover {
      opacity: 0.9;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    li button {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .input-group {
        flex-direction: column;
      }
      .input-group button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Shared Todo List</h1>
  </header>
  <main>
    <div class="input-group">
      <input type="text" id="newItem" placeholder="Add a new todo" aria-label="New todo">
      <button id="addBtn">Add</button>
    </div>
    <ul id="todoList" aria-live="polite"></ul>
  </main>
  <script>
    const todoList = document.getElementById('todoList');
    const newItemInput = document.getElementById('newItem');
    const addBtn = document.getElementById('addBtn');

    async function fetchItems() {
      try {
        const resp = await fetch('/items');
        if (!resp.ok) throw new Error('Network response was not ok');
        const items = await resp.json();
        renderList(items);
      } catch (e) {
        console.error('Failed to fetch items:', e);
      }
    }

    function renderList(items) {
      todoList.innerHTML = '';
      items.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      items.forEach(item => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = item.text;
        li.appendChild(span);

        const delBtn = document.createElement('button');
        delBtn.textContent = '✖';
        delBtn.setAttribute('aria-label', 'Delete ' + item.text);
        delBtn.addEventListener('click', () => deleteItem(item.id));
        li.appendChild(delBtn);

        todoList.appendChild(li);
      });
    }

    async function addItem() {
      const text = newItemInput.value.trim();
      if (!text) return;
      try {
        const resp = await fetch('/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!resp.ok) throw new Error('Failed to add');
        newItemInput.value = '';
        fetchItems();
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteItem(id) {
      try {
        const resp = await fetch('/items/' + id, { method: 'DELETE' });
        if (!resp.ok && resp.status !== 204) throw new Error('Failed to delete');
        fetchItems();
      } catch (e) {
        console.error(e);
      }
    }

    addBtn.addEventListener('click', addItem);
    newItemInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') addItem();
    });

    fetchItems();
  </script>
</body>
</html>
